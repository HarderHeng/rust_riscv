[toolchain]
channel = "nightly-2026-09-17"
components = ["rust-src", "llvm-tools-preview", "rustfmt", "clippy"]
# BL808 E902/E907 use board-local `-Z build-std=core` because their
# no-std target libraries are not distributed by rustup for this toolchain.
targets = [
    "riscv32imac-unknown-none-elf",   # RV32IMAC - QEMU virt, BL808 C906
    "riscv64imac-unknown-none-elf",   # RV64IMAC - Future 64-bit support
]
