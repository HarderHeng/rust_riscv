[package]
name = "qemu-virt-rv32"
version = "0.1.0"
edition = "2021"

[dependencies]
# Platform-agnostic kernel
kernel = { path = "../../kernel" }

# HAL trait definitions
hal = { path = "../../hal" }

# RISC-V common utilities (startup code, CSR access)
riscv-common = { path = "../../riscv-common" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"      # Optimize for size
lto = true           # Enable link-time optimization
codegen-units = 1    # Better optimization, slower compile
