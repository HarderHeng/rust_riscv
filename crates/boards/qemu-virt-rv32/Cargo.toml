[package]
name = "qemu-virt-rv32"
version = "0.1.0"
edition = "2021"

[features]
default = []
virtio-console = ["dep:spin"]

[dependencies]
# Platform-agnostic kernel
kernel = { workspace = true }

# HAL trait definitions
hal = { workspace = true }

# RISC-V common utilities (startup code, CSR access)
riscv-common = { workspace = true }
spin = { workspace = true, optional = true }
