# Workspace-level Cargo configuration

# Build aliases for different board targets
[alias]
qemu = "build --package qemu-virt-rv32"
qemu-run = "run --package qemu-virt-rv32"
bl808-e902 = "build --package bl808-e902"
bl808-e907 = "build --package bl808-e907"
bl808-c906 = "build --package bl808-c906"

# Default build target (can be overridden per-package)
[build]
target = "riscv32imac-unknown-none-elf"

# QEMU virt-rv32 board configuration (RV32IMAC)
[target.riscv32imac-unknown-none-elf]
runner = "./qemu-runner.sh"
rustflags = [
    "-C", "link-arg=-Map=kernel.map",
]

# BL808 E902 configuration (RV32EMC - embedded profile, no atomics)
[target.riscv32emc-unknown-none-elf]
# The board build script supplies its copied linker script.
rustflags = ["--cfg", "portable_atomic_unsafe_assume_single_core"]

# BL808 E907 configuration (RV32IMafc - with float)
[target.riscv32imafc-unknown-none-elf]
# The board build script supplies its copied linker script.
rustflags = ["--cfg", "portable_atomic_unsafe_assume_single_core"]

# RV64IMAC configuration (future use)
[target.riscv64imac-unknown-none-elf]
rustflags = []
