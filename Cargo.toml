[workspace]
resolver = "2"
members = [
    "crates/hal",
    "crates/riscv-common",
    "crates/kernel",
    "crates/boards/qemu-virt-rv32",
    "crates/boards/bl808-e902",
    "crates/boards/bl808-e907",
    "crates/boards/bl808-c906",
]

[workspace.dependencies]
# Shared dependencies across all workspace members
spin = { version = "0.9", features = ["portable_atomic"] }
heapless = "0.8"

# Internal workspace crates
hal = { path = "crates/hal" }
riscv-common = { path = "crates/riscv-common" }
kernel = { path = "crates/kernel" }

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Enable Link Time Optimization
panic = "abort"      # Abort on panic (no unwinding in bare-metal)
codegen-units = 1    # Better optimization with single codegen unit

[profile.dev]
panic = "abort"      # Abort on panic in debug builds too
