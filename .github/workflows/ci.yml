name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-17
          targets: riscv32imac-unknown-none-elf
          components: rustfmt, clippy, llvm-tools-preview, rust-src

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (kernel host lib)
        run: cargo clippy -p kernel --target x86_64-unknown-linux-gnu --lib -- -D warnings

      - name: Clippy (qemu-virt-rv32 release)
        run: cargo clippy -p qemu-virt-rv32 --release -- -D warnings

      - name: Kernel host tests
        run: cargo test -p kernel --target x86_64-unknown-linux-gnu --lib

      - name: Check qemu-virt-rv32 release
        run: cargo check -p qemu-virt-rv32 --release

      - name: Check qemu-virt-rv32 release (virtio-console)
        run: cargo check -p qemu-virt-rv32 --release --features virtio-console

      - name: Build qemu-virt-rv32 release
        run: cargo build -p qemu-virt-rv32 --release

      - name: Text size gate (qemu-virt-rv32 release)
        run: |
          set -euo pipefail
          ELF="target/riscv32imac-unknown-none-elf/release/qemu-virt-rv32"
          # Berkeley `text` (~.text+.rodata). Current ~20242; 24KiB leaves headroom.
          MAX_TEXT=24576
          if command -v llvm-size >/dev/null 2>&1; then
            SIZE_BIN="$(command -v llvm-size)"
          elif [ -x "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-size" ]; then
            SIZE_BIN="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-size"
          else
            echo "llvm-size not found" >&2
            exit 1
          fi
          echo "=== llvm-size (qemu-virt-rv32 release) ==="
          "$SIZE_BIN" "$ELF"
          TEXT="$("$SIZE_BIN" "$ELF" | awk 'NR==2 {print $1; exit}')"
          echo "text=$TEXT max=$MAX_TEXT"
          if ! [[ "$TEXT" =~ ^[0-9]+$ ]]; then
            echo "could not parse text size from llvm-size output" >&2
            exit 1
          fi
          if [ "$TEXT" -gt "$MAX_TEXT" ]; then
            echo "text size $TEXT exceeds budget $MAX_TEXT" >&2
            exit 1
          fi

  qemu-smoke:
    name: qemu-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-17
          targets: riscv32imac-unknown-none-elf
          components: rust-src, llvm-tools-preview

      - name: Build qemu-virt-rv32 release
        run: cargo build -p qemu-virt-rv32 --release

      - name: Run QEMU smoke test
        run: python3 scripts/qemu_smoke_test.py target/riscv32imac-unknown-none-elf/release/qemu-virt-rv32
